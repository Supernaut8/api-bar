    <style>
        /* Estilos específicos para que el ticket parezca una factura de 80mm */
        #ticket-thermal-container {
            background-color: #fff;
            color: #000;
            font-family: 'Courier New', Courier, monospace;
            width: 300px; /* Ancho simulado de 80mm */
            margin: 20px auto;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            font-size: 14px;
            line-height: 1.2;
        }

        .ticket-line {
            border-bottom: 1px dashed #000;
            margin: 8px 0;
        }

        .text-center-ticket {
            text-align: center;
            display: block;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
        }

        .bold-ticket {
            font-weight: bold;
        }

        /* Estilo para el botón de imprimir que combine con tu app */
        .print-button-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        @media print {
            header, .print-button-container { display: none !important; }
            body { background-color: white !important; }
            #ticket-thermal-container { box-shadow: none; margin: 0; width: 100%; }
        }
    </style>
</head>
