<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles.css">
    <!-- <script defer src="/your-path-to-fontawesome/js/solid.js"></script> -->
</head>

<body id="barra-body">
    <header>
        <nav>
            <div class="back-container">
                <span>
                    <a class="buttonBack" href="../index.html">Volver</a>
                </span>
            </div>
        </nav>
        <h2>Pedido</h2>
    </header>
    <main>
        <section id="counter-section">
            <div class="toast-container position-fixed top-50 start-50 translate-middle d-flex justify-content-center align-items-center" style="z-index: 1050; width: 100%;"></div>
            <form id="orderBar-form">
                <div class="counter-item">
                    <div class="options-container">
                        <span>Bebidas</span>
                        <select name="alimentoBebidas" id="alimentoBebidas"></select>
                    </div>
                    <div class="options-container">
                        <span>Variedad</span>
                        <select name="bebidasVariantes" id="bebidasVariantes"></select>
                    </div>
                    <div class="options-container">
                        <input type="text" id="cantidadBebidas" name="cantidadBebidas" placeholder="Unidades">
                    </div>
                </div>
                <div class="button-container">
                    <input class="addButton" type="submit" id="agregar" name="agregar" value="Agregar al pedido">
                </div>
            </form>
            <form id="sendOrder-form">
                <div class="aggregate-container">
                    <h3 id="orderBarTitle">Pedido en curso:</h3>
                    <div class="table-container">
                        <table id="orderBarTable"></table>
                    </div>
                    <div id="total-container-BarTable"></div>
                </div>
                <div class="button-container">
                    <input class="sendButton" type="submit" id="enviar" name="enviar" value="Enviar Pedido">
                </div>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="../scripts/mensajesAlCLiente.js"></script>
    <script type="module" src="./tablaPedidoBarra.js"></script>
    <script type="module" src="../scripts/barra.js"></script>
</body>

</html>
