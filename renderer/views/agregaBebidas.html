<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrega Artículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles.css">
    <!-- <script defer src="/your-path-to-fontawesome/js/solid.js"></script> -->
</head>

<body>
    <header>
        <nav>
            <div class="back-container">
                <span>
                    <a href="./bebidas.html">Volver</a>
                </span>
            </div>
        </nav>
        <h2>Ingreso de artículos</h2>
    </header>
    <main>
        <section id="addItems-section">
            <div class="toast-container position-fixed top-50 start-50 translate-middle d-flex justify-content-center align-items-center" style="z-index: 1050; width: 100%;"></div>
            <form id="items-form">
                <div class="grid-container">
                    <div class="grid-item">
                        <div class="title-container">
                            <span class="title">Bebidas</span>
                        </div>
                        <div class="select-container">
                            <select name="tipoDeBebidas" id="tipoDeBebidas">
                                <option value="">Seleccione un tipo de bebida</option>
                                <option value="aguas">Aguas</option>
                                <option value="gaseosas">Gaseosas</option>
                                <option value="cervezas">Cervezas</option>
                                <option value="tragos">Tragos</option>
                            </select>
                            <select name="bebidasVariantes" id="bebidasVariantes">
                                <option value="">Seleccione bebida</option>
                            </select>
                        </div>
                        <div class="inputs-container">
                            <!-- <input type="text" id="descripcion" name="descripcion" placeholder="Descripcion"> -->
                            <input type="text" id="cantidad" name="cantidad" placeholder="Unidades">
                            <input type="text" id="costo" name="costo" placeholder="Precio de costo">
                            <input type="text" id="iva" name="iva" placeholder="%IVA">
                            <input type="text" id="ganacia" name="ganancia" placeholder="%Ganancia">
                        </div>
                        <div class="button-container">
                            <input type="submit" id="agregar" name="agregar" value="Agregar">
                        </div>
                    </div>
                </div>
            </form>
            <div class="aggregate-container">
                <h3>Lista de ingresos</h3>
                <div class="table-container">
                    <table id="aggregate-table"></table>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="./mensajesAlCLiente.js"></script>
    <script type="module" src="./tablaCompras.js"></script>
    <script type="module" src="../scripts/articulos.js"></script>
</body>

</html>
