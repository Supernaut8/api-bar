<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- <script defer src="/your-path-to-fontawesome/js/solid.js"></script> -->
</head>

<body>
    <header>
        <nav>
            <div class="back-container">
                <span>
                    <a href="../index.html">Volver</a>
                </span>
            </div>
        </nav>
        <h2>Caja</h2>
    </header>
    <main>
        <section id="cash-section">
            <div class="grid-container">
                <div class="grid-item">
                    <div class="card-container">
                        <form id="opening">
                            <div class="cash-box">
                                <span>
                                    Apertura                            
                                </span>
                            </div>
                            <input id="openInput" type="text">
                        </form>
                    </div>
                </div>
                <div class="grid-item">
                    <div class="card-container">
                        <form id="closing">
                            <div class="cash-box">
                                <span>
                                    Cierre
                                </span>
                            </div>
                            <input id="closeInput" type="text">
                        </form>
                    </div>
                </div>
                <div class="grid-item">
                    <div class="card-container">
                        <div class="button-container">
                            <button class="btn btn-outline-danger">Resetear monto</button>
                            <button class="btn btn-outline-primary">Abrir caja</button>
                            <button class="btn btn-outline-success">Cerrar caja</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- <div>
                <button>Resetear Caja</button>
                <button>Cerrar Caja</button>
            </div> -->
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script type="module" src="../scripts/caja.js"></script>
</body>
</html>
