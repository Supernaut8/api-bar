    <main>
        <section id="order-section">
            <div class="toast-container position-fixed top-50 start-50 translate-middle d-flex justify-content-center align-items-center" style="z-index: 1050; width: 100%;"></div>
            <form id="order-form">
                <div class="barTable-container">
                    <span>Mesa</span>
                    <select name="mesa" id="mesa">

                        <option value="6">6</option>
                        <option value="7">7</option>
                    </select>
                </div>
                <div class="grid-container">
                    <div class="grid-item">
                        <span>Alimentos</span>
                        <select name="alimentos" id="alimentos">
                            <option value="">Seleccione una opción</option>
                            <option value="bebidas">Bebidas</option>
                            <option value="comidas">Comidas</option>
                            <!-- <option value="cervezas">Cervezas</option>

                        <select name="alimentosVariantes" id="alimentosVariantes">

                        </select>
                        <select name="varianteOpcion" id="varianteOpcion">
                            <option value="">Seleccione variante</option>
                        </select>
                        <div>
                            <input type="text" id="alimentosCantidad" name="alimentosCantidad" placeholder="Unidades">
                        </div>
                        <div class="button-container">
                            <input type="submit" id="agregarAlimento" name="agregarAlimento" value="Agregar">
                        </div>
                    </div>

            <form id="order">
                <div class="order-container">
                    <table id="order-table"></table>
                    <div id="total-container"></div>
                </div>
                <div class="button-container">
                    <input type="submit" id="agregarPedido" name="agregarPedido" value="Enviar Pedido">
                </div>
            </form>
        </section>
