<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

               script-src 'self' https://cdnjs.cloudflare.com;
               style-src 'self' https://cdnjs.cloudflare.com;
               font-src 'self' https://cdnjs.cloudflare.com;
               img-src 'self' data:;"> -->
    <title>Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles.css">
    <!-- <script defer src="/your-path-to-fontawesome/js/solid.js"></script> -->
</head>

<body id="order-body">
    <header>
        <nav>
            <div class="back-container">
                <span>
                    <a class="buttonBack" href="../index.html">Volver</a>
                </span>
            </div>
        </nav>
        <h2>Pedido</h2>
    </header>
    <main>
        <section id="order-section">
            <div class="toast-container position-fixed top-50 start-50 translate-middle d-flex justify-content-center align-items-center"
                style="z-index: 1050; width: 100%;"></div>
            <form id="order-form">
                <div class="barTable-container">
                    <span>Mesa</span>
                    <select name="mesa" id="mesa">
                        <option value="">Seleccione una opción</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                    </select>
                </div>
                <div class="grid-container">
                    <div class="grid-item">
                        <div class="select-container">
                            <span>Alimentos</span>
                            <select name="alimentos" id="alimentos">
                                <option value="">Seleccione una opción</option>
                                <option value="bebidas">Bebidas</option>
                                <option value="comidas">Comidas</option>
                            </select>
                            <select name="alimentosVariantes" id="alimentosVariantes">
                                <option value="">Seleccione alimento</option>
                            </select>
                            <select name="varianteOpcion" id="varianteOpcion">
                                <option value="">Seleccione variante</option>
                            </select>
                            <div>
                                <input type="text" id="alimentosCantidad" name="alimentosCantidad"
                                    placeholder="Unidades">
                            </div>
                            <div class="button-container">
                                <input class="addButton" type="submit" id="agregarAlimento" name="agregarAlimento"
                                    value="Agregar">
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <form id="order">
                <div class="order-container">
                    <h3 id="OrderTitle">Pedido en curso:</h3>
                    <div class="table-container">
                        <table id="order-table"></table>
                    </div>
                    <div id="total-container"></div>
                </div>
                <!-- <div class="button-container">
                    <input class="sendButton" type="submit" id="imprimir" name="imprimir" value="Imprimir ticket">
                </div> -->
                <div class="button-container">
                    <input class="sendButton" type="submit" id="agregarPedido" name="agregarPedido" value="Enviar Pedido">
                </div>
                <!-- <div class="button-container">
                    <button id="btnTestPrint">Test impresión</button>
                </div> -->
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="../scripts/mensajesAlCLiente.js"></script>
    <script type="module" src="./tablaPedido.js"></script>
    <script type="module" src="../scripts/pedido.js"></script>
</body>

</html>
